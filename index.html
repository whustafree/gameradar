<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover activa los env(safe-area-inset-*) del CSS;
         sin límites de escala para no bloquear el zoom (WCAG 1.4.4). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="description" content="GameRadar — Tu radar de ofertas y juegos gratis en todas las plataformas. Actualizado a diario.">
    <meta name="theme-color" content="#08080c" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f6f6f9" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="GameRadar">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="GameRadar — Radar de ofertas de juegos">
    <meta property="og:description" content="Descubre juegos gratis y ofertas de Steam, Epic, GOG y Android. Actualizado a diario.">
    <meta property="og:image" content="/social-preview.png">
    <meta name="twitter:card" content="summary_large_image">

    <title>GameRadar — Radar de ofertas de juegos</title>

    <!-- Aplica tema/acento ANTES del primer paint: sin esto el body pinta
         blanco hasta que React monta (las variables viven bajo [data-theme]). -->
    <script>
      (function () {
        try {
          var THEMES = ['dark', 'amoled', 'light'];
          var theme = localStorage.getItem('fgh_theme_v1');
          if (THEMES.indexOf(theme) === -1) theme = 'dark';
          var accent = localStorage.getItem('fgh_accent_v1') || 'violet';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.setAttribute('data-accent', accent);
          root.style.colorScheme = theme === 'light' ? 'light' : 'dark';
        } catch (e) {
          /* localStorage bloqueado: quedan los valores por defecto del HTML */
        }
      })();
    </script>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
